<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Link Hub</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen m-0" x-data="socialHub()">

<!-- Header Navigation -->
<header class="bg-slate-800 border-b border-slate-700 py-4 px-6 flex justify-between items-center shadow-md">
  <h1 class="text-xl font-bold tracking-wide text-indigo-400 flex items-center">
    <i class="fa-solid fa-share-nodes mr-2"></i>LinkHub Pro
  </h1>
</header>

<!-- Main Content Container -->
<main class="max-w-2xl mx-auto p-4 sm:p-6 mt-4">

  <!-- ================= USER VIEW ================= -->
  <section x-show="currentView === 'user'" class="space-y-6">
    <!-- Profile Info -->
    <div class="text-center space-y-3">
      <img :src="profile.avatar" alt="Profile Avatar" class="w-24 h-24 rounded-full mx-auto border-4 border-indigo-500 shadow-xl object-cover">
      <h2 class="text-2xl font-bold text-white" x-text="profile.name"></h2>
      <p class="text-slate-400 text-sm max-w-sm mx-auto" x-text="profile.bio"></p>
    </div>

    <!-- Social Links List -->
    <div class="space-y-3 mt-6">
      <template x-for="link in links" :key="link.id">
        <a :href="link.url" target="_blank"
           class="flex items-center justify-between p-4 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl shadow-lg transition transform hover:-translate-y-0.5 group">
          <div class="flex items-center space-x-4">
            <div class="w-10 h-10 rounded-lg bg-indigo-500/10 text-indigo-400 flex items-center justify-center text-lg group-hover:bg-indigo-600 group-hover:text-white transition">
              <i :class="link.icon"></i>
            </div>
            <span class="font-medium text-slate-200" x-text="link.title"></span>
          </div>
          <i class="fa-solid fa-arrow-up-right-from-square text-slate-500 group-hover:text-slate-300 text-sm"></i>
        </a>
      </template>

      <div x-show="links.length === 0" class="text-center py-10 text-slate-500">
        No social links available yet.
      </div>
    </div>
  </section>

  <!-- ================= ADMIN PANEL ================= -->
  <section x-show="currentView === 'admin'" class="space-y-6">
    <!-- Add Link Form -->
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
      <h3 class="text-lg font-bold text-white mb-4 flex items-center">
        <i class="fa-solid fa-circle-plus mr-2 text-indigo-400"></i> Add New Social Link
      </h3>

      <form @submit.prevent="addLink" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Platform Name</label>
          <input type="text" x-model="newTitle" placeholder="e.g. Instagram, YouTube, GitHub" required
                 class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Destination URL</label>
          <input type="url" x-model="newUrl" placeholder="https://instagram.com/yourusername" required
                 class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">FontAwesome Icon Class</label>
          <input type="text" x-model="newIcon" placeholder="e.g. fa-brands fa-instagram" required
                 class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-indigo-500">
          <span class="text-xs text-slate-500 mt-1 block">Use FontAwesome classes (e.g., <code class="text-indigo-400">fa-brands fa-x-twitter</code>)</span>
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-lg transition shadow-md">
          Publish Link
        </button>
      </form>
    </div>

    <!-- Manage Active Links -->
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
      <h3 class="text-lg font-bold text-white mb-4 flex items-center">
        <i class="fa-solid fa-list-check mr-2 text-indigo-400"></i> Active Links
      </h3>
      <div class="space-y-3">
        <template x-for="link in links" :key="link.id">
          <div class="flex items-center justify-between p-3 bg-slate-900 border border-slate-700 rounded-xl">
            <div class="flex items-center space-x-3 truncate">
              <i :class="link.icon" class="text-indigo-400 text-lg w-6 text-center"></i>
              <div class="truncate">
                <h4 class="text-sm font-semibold text-white truncate" x-text="link.title"></h4>
                <p class="text-xs text-slate-400 truncate" x-text="link.url"></p>
              </div>
            </div>
            <button @click="deleteLink(link.id)" class="text-rose-400 hover:text-rose-300 p-2 transition" title="Delete Link">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </div>
        </template>
      </div>
    </div>
  </section>

</main>

<!-- Application Logic -->
<script>
  const getCurrentView = () => {
    return window.location.hash === '#admin' ? 'admin' : 'user';
  };

  document.addEventListener('alpine:init', () => {
    Alpine.data('socialHub', () => ({
      currentView: getCurrentView(),
      profile: {
        name: 'Alex Johnson',
        bio: 'Digital Creator | Developer | Tech Enthusiast 🚀',
        avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=250'
      },
      newTitle: '',
      newUrl: '',
      newIcon: '',
      init() {
        const updateView = () => { this.currentView = getCurrentView(); };
        window.addEventListener('popstate', updateView);
        window.addEventListener('hashchange', updateView);
      },
      links: JSON.parse(localStorage.getItem('social_links')) || [
        { id: 1, title: 'YouTube Channel', url: 'https://youtube.com', icon: 'fa-brands fa-youtube' },
        { id: 2, title: 'Instagram Profile', url: 'https://instagram.com', icon: 'fa-brands fa-instagram' },
        { id: 3, title: 'GitHub Portfolio', url: 'https://github.com', icon: 'fa-brands fa-github' },
        { id: 4, title: 'Twitter / X', url: 'https://twitter.com', icon: 'fa-brands fa-x-twitter' }
      ],
      addLink() {
        if (!this.newTitle || !this.newUrl || !this.newIcon) return;

        this.links.push({
          id: Date.now(),
          title: this.newTitle,
          url: this.newUrl,
          icon: this.newIcon
        });

        this.saveToStorage();
        this.newTitle = '';
        this.newUrl = '';
        this.newIcon = '';
      },
      deleteLink(id) {
        this.links = this.links.filter(link => link.id !== id);
        this.saveToStorage();
      },
      saveToStorage() {
        localStorage.setItem('social_links', JSON.stringify(this.links));
      }
    }));
  });
</script>
</body>
</html>
